[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-anomaly"
version = "0.1.0"
description = "Anomaly detection on labelled synthetic series with STL-style decomposition, rolling z-score, EWMA and isolation forest baselines"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
