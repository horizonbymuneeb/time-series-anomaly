# Tunables read by src/anomaly/config.py.

seed: 41

generator:
  n_series: 12
  length: 1500
  period: 24          # daily cycle
  weekly_period: 168  # weekly cycle
  trend_slope: 0.0006
  noise_std: 1.0
  ar_coefficient: 0.35
  # Calibration prefix is anomaly-free by construction.
  calibration_fraction: 0.30
  anomaly_rate: 0.05
  anomaly_types: [spike, level_shift, variance_change, missing_block]
  spike_magnitude: 6.0
  level_shift_offset: 3.0
  variance_factor: 3.5
  missing_value: 0.0

detector:
  zscore_window: 48
  zscore_threshold_sigma: 4.0
  ewma_alpha: 0.15
  ewma_sigma: 2.5
  iforest_window: 24
  iforest_n_estimators: 120
  iforest_random_state: 7
  fp_budget: 0.01     # false-positive budget used to calibrate thresholds
  delay_window: 12

evaluation:
  precision_k: 50
